<main>
<div class="hero">
  <div class="k">第 7 课 · 综合考察</div>
  <h1>随机抽测：你能拿满分吗</h1>
  <div class="sub">从 31 题的题库中随机抽 12 题，覆盖全部 7 课。答错有解析；错题对应的那一课回去重看。</div>
</div>

<div id="exam" data-count="12"></div>

<div class="keypoint" style="margin-top:32px">
  <span class="tag">考察之后</span>
  <ul style="margin:0">
    <li><b>满分</b>：试试"空手重写"——合上书手写 lexer 的数字分支或 parser 的一个产生式，再和源码对比。</li>
    <li><b>8 分以上</b>：把错题对应课的"动手实验"重做一遍。</li>
    <li><b>终极检验</b>：四个人互相抽问审阅指南里的"可能被问的问题"，追问一层"为什么"。</li>
  </ul>
</div>
</main>
<script>
window.EXAM_QUESTIONS = [
  // ---- 第 0 课 全局 ----
  { q: "CBL 编译链路的正确顺序是？", opts: [
    "词法 → 语法 → 语义 → IR → 引擎 → 报告",
    "语法 → 词法 → 语义 → IR → 引擎 → 报告",
    "词法 → 语义 → 语法 → 引擎 → IR → 报告" ], a: 0,
    why: "词法切词 → 语法组树 → 语义查意思 → IR 交接 → 引擎执行 → 报告呈现。" },
  { q: "编译期与运行期的分界在哪？", opts: [
    "IR 生成与引擎执行之间",
    "词法与语法之间",
    "引擎与报告之间" ], a: 0,
    why: "JSON 计划是交接单：之前全是静态编译，之后才碰真实材料。" },
  { q: "CBL 的翻译目标（第一目标形式）是什么？", opts: [
    "JSON 组装计划（IR）", "机器码", "Python 字节码" ], a: 0,
    why: "DSL 走\"JSON 中间表示 + 解释执行\"路线，不做代码生成。" },
  // ---- 第 1 课 词法 ----
  { q: "Token 的四个字段是？", opts: [
    "类型、字面值、行号、列号",
    "类型、值、优先级、块名",
    "关键字、内容、位置、长度" ], a: 0,
    why: "kind / value / line / col，后两个是报错定位的依据。" },
  { q: "为什么双字符运算符 <= 要在单字符界符之前判断？", opts: [
    "否则会被切成 < 和 = 两个 Token（最长匹配）",
    "双字符更快",
    "顺序无所谓" ], a: 0,
    why: "最长匹配原则：永远匹配能匹配的最长 Token。" },
  { q: "关键字 window 是怎么被识别的？", opts: [
    "先按标识符读完整词，再查关键字表",
    "看到 w 开头特判",
    "语法分析器事后标注" ], a: 0,
    why: "查表机制让关键字自动成为保留字，不能当块名。" },
  { q: "标识符判定为什么要 ch.isascii() and ch.isalpha()，而不只写 isalpha()？", opts: [
    "Python 的 isalpha() 把汉字也算字母，而文法规定标识符只含 ASCII",
    "isascii 更快",
    "为了支持 emoji" ], a: 0,
    why: "词法分析器必须严格实现正规式 [A-Za-z_][A-Za-z0-9_]*。" },
  { q: "CBL 字符串的规则是？", opts: [
    "双引号括起、不跨行、不处理转义",
    "单双引号都可以、支持转义",
    "可以跨行" ], a: 0,
    why: "计划书正规式的规定；字符串只用来写文件路径，够用就好。" },
  // ---- 第 2 课 语法 ----
  { q: "递归下降的核心思想？", opts: [
    "一条 EBNF 产生式对应一个函数，函数按文法结构互相调用",
    "用栈模拟 LR 自动机",
    "正则表达式匹配" ], a: 0 },
  { q: "CBL 文法是 LL(1) 的，意味着什么？", opts: [
    "每个选择点只看 1 个前瞻 Token 就能定分支，无需回溯",
    "文法只有 1 条产生式",
    "只能从左往右读一遍文件" ], a: 0,
    why: "顶层看 window/block/rule，块内看条目关键字，operand 看 INT 还是 window。" },
  { q: "字符串 \";\" 为什么不能冒充分号终结符？", opts: [
    "_is 同时比较字面值和 Token 类型（KEYWORD/SYMBOL），字符串类型不符",
    "字符串里没有分号",
    "parser 会忽略所有字符串" ], a: 0,
    why: "值相同 ≠ 同一个终结符；词法类别本身是语法的一部分（真实修复过的 bug）。" },
  { q: "cap: 40% 在什么时候折算成绝对 token 数？", opts: [
    "整条程序解析完、window 已知后，parser 的 _resolve_caps 统一折算",
    "词法分析时",
    "引擎运行时" ], a: 0,
    why: "解析 block 时 window 可能还没声明（声明顺序自由），所以先记下，最后折算。" },
  { q: "恐慌模式错误恢复的同步点是？", opts: [
    "顶层认 ; / } / 下一条声明开头；块内认 ; 和 }",
    "只认换行",
    "每出错就跳到文件尾" ], a: 0,
    why: "跳过坏的部分但不吃掉属于上层结构的 token——} 要留给外层 parse_block 消费。" },
  { q: "must_keep 块没写 overflow 时缺省值是什么？为什么？", opts: [
    "error——死保信息不允许被任何策略裁剪",
    "truncate_tail——和其他块一样",
    "summarize——压成摘要最安全" ], a: 0,
    why: "缺省值在语法分析时填入，配合语义约束⑨（显式写别的会报 E901）。" },
  // ---- 第 3 课 语义与 IR ----
  { q: "错误目录 CATALOG 里编号首字母 R 表示？", opts: [
    "规则违例，级别由该规则的 on_violation 决定",
    "运行时错误",
    "致命错误" ], a: 0,
    why: "E=错误、W=警告、R=规则违例；R702 的级别不固定。" },
  { q: "约束②（无解判定）检查什么？", opts: [
    "must_keep 块 cap 之和不得超过 window，否则预算逻辑上无解",
    "所有块 cap 之和不得超窗",
    "cap 不得为负数" ], a: 0,
    why: "死保块不参与压缩，它们超窗就永远执行不了——编译期直接报。" },
  { q: "属性文法在 CBL 里的体现是？", opts: [
    "Σcap 是综合属性（自底向上），window/margin 起继承属性作用（自顶向下），约束是属性上的谓词",
    "CBL 没有属性文法",
    "只有综合属性没有继承属性" ], a: 0 },
  { q: "total_reserved 和 every_block_min_tokens 的求值时机分别是？", opts: [
    "编译期 / 运行期",
    "运行期 / 编译期",
    "都在编译期" ], a: 0,
    why: "前者只依赖 cap 和 window；后者取决于本次可用额度 B，编译期不知道。" },
  { q: "IR 里为什么缺省值全部显式写出？", opts: [
    "引擎不需要知道 CBL 的缺省规则，编译器与引擎解耦、可独立演化",
    "为了 JSON 更长",
    "历史遗留" ], a: 0 },
  { q: "新增一条语义检查的标准三步是？", opts: [
    "CATALOG 加一行 → 写函数挂进 CHECKS → PAIRS 加一对正反例",
    "改 parser → 改 engine → 改 report",
    "写测试 → 写文档 → 发版" ], a: 0,
    why: "漏写测试会被 case_catalog_covered 自动拦下。" },
  // ---- 第 4 课 引擎 ----
  { q: "额度不足时的压缩次序是？", opts: [
    "low → medium → high，逐级压缩，must_keep 不参与",
    "high → medium → low",
    "所有块一起按比例压" ], a: 0,
    why: "优先级语义就是严格先后；担心饿死可以写 no_starvation 规则兜底。" },
  { q: "最大余数法解决什么问题？", opts: [
    "同级按 cap 等比例压缩时的小数取整：先发整数部分，余额按小数部分从大到小补，总和恰好达标",
    "解决浮点精度",
    "解决内存分配" ], a: 0,
    why: "例：3 块各 100 分 200 → 67、67、66，总和恰好 200。" },
  { q: "token 估算为什么宁多勿少？", opts: [
    "估多了只是少放一点（无害），估少了会真的超窗（有害）",
    "多估显得严谨",
    "没有原因" ], a: 0,
    why: "需要精确计数时可传 counter=tiktoken（可插拔）。" },
  { q: "summarize 策略放不下时会怎样？", opts: [
    "退化为 sliding_window（保最新）",
    "报错拒绝组装",
    "无限压缩直到放下" ], a: 0,
    why: "策略有降级链；error 策略才拒绝组装。" },
  { q: "validate_plan 的存在说明引擎怎样对待 IR？",opts: [
    "不假设计划来自本编译器，入口校验结构与取值，非法计划一次列出全部问题",
    "完全信任",
    "只校验 window 字段" ], a: 0 },
  { q: "must_keep 块实际用量超过 cap 时引擎怎么做？", opts: [
    "拒绝组装并报错，绝不静默裁剪",
    "自动截断",
    "压缩其他块给它腾地方" ], a: 0 },
  // ---- 第 5 课 报告与网页 ----
  { q: "审计报告三种视图共用什么？", opts: [
    "同一份 audit dict 主格式；网页与 HTML 还共用同一个 JS 渲染器",
    "同一个 Word 模板",
    "各自独立实现" ], a: 0 },
  { q: "网页实验台防止读取任意文件的机制是？", opts: [
    "source 字符串被限制在材料目录内（路径沙箱）",
    "禁止编辑源码",
    "加密材料文件" ], a: 0,
    why: "网页允许编辑源码，不限制的话 ../../ 能读出电脑上的任意文件。" },
  { q: "防 XSS 的两道关？", opts: [
    "渲染只用 textContent + 内嵌 JSON 把 < > & 转成 \\u 形式",
    "HTTPS + 登录鉴权",
    "CDN + 防火墙" ], a: 0 },
  // ---- 第 6 课 测试 ----
  { q: "快照测试防的是什么？", opts: [
    "引擎改动悄悄改变裁剪行为——输出被冻结，任何变化都要人确认",
    "代码风格变化",
    "编译速度变慢" ], a: 0 },
  { q: "case_catalog_covered 保证什么？", opts: [
    "错误目录每一项都配有正反例测试",
    "测试一定全部通过",
    "代码覆盖率达 100%" ], a: 0 }
];
</script>
