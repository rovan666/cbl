name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]   # 3.9 已 EOL，setup-python 在新 runner 上装不了
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 运行自检（零第三方依赖，无需安装）
        run: python tests/run_tests.py
      - name: 验证 pip 安装后缺省示例可用（离开仓库目录，确保导入的是安装版）
        run: |
          pip install .
          cd "$RUNNER_TEMP"
          python -c "import os; from cbl.cli import DEFAULT_EXAMPLE as p; from cbl.webui import make_handler; assert 'site-packages' in p, p; make_handler(p, os.path.join(os.path.dirname(p), 'materials')); print(p)"
